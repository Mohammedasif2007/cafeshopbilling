<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asif Cafe - Login</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-hero">
      <img src="assets/logo.svg" class="login-mark" alt="Asif Cafe">
      <p class="hero-kicker">Tea shop billing system</p>
      <h1>Asif Cafe</h1>
      <p class="login-copy">Fast billing, clear reports, and smooth order handling for every busy counter.</p>
      <div class="login-highlights" aria-label="System highlights">
        <span>Employee Billing</span>
        <span>Owner Reports</span>
        <span>Print Bills</span>
      </div>
    </section>

    <section class="card login-card">
      <img src="assets/logo.svg" class="logo" alt="Asif Cafe">
      <p class="eyebrow">Welcome back</p>
      <h2>Sign in</h2>

      <label for="username">Username</label>
      <select id="username" autocomplete="username">
        <option value="employee">Employee</option>
        <option value="owner">Owner</option>
      </select>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">

      <button class="login-button" onclick="login()">Login</button>
      <p id="error" class="error"></p>
    </section>
  </main>

  <footer class="site-footer app-footer">
    <p>Follow us on</p>
    <div class="social-links">

</body>
</html>
